# speedbot_v4_leg 站立假数据模板（来自 MuJoCo ros2 仿真实测采样）
# 采样方式：
#   CONTROL_MODE=mujoco_ros2 AUTOWALK=0 ./walk_mpc_wbc_leg
#   ros2 topic echo /imu/data --once
#   ros2 topic echo /joint_states --once
#
# 用途：
# - 给 ros2_real 控制链路喂“非全零”反馈，验证控制流程与话题格式
# - 避免全零 IMU/关节状态导致状态估计与QP在初始化阶段异常

meta:
  robot_variant: speedbot_v4_leg
  source: mujoco_ros2_sample
  sample_time_local: "2026-04-21"
  notes:
    - "joint_states 名称与数组长度必须一致（12）"
    - "imu 四元数不要全零，建议保持单位四元数附近"
    - "若要验证步态切换，joint effort 建议提供非零合理值"

ros_topics:
  imu: /imu/data
  joint_states: /joint_states
  action_cmd: /rl_motion_control_command

